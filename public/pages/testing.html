<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gradient Photo Background</title>
<style>
    body {
    margin: 0;
    min-height: 100vh;
    background-color: #050e3f; 
    overflow-x: hidden;
}

img {
    display: block;
    width: 100vw;
    height: 80vh;
    object-fit: cover;
    position: relative;
    margin-bottom: -25vh; 
}

.image1 {
    z-index: 4;
    mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
    -webkit-mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
}

.image2 {
    z-index: 3;
    mask-image: linear-gradient(to bottom, transparent 0%, black 30%, black 70%, transparent 100%);
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 30%, black 70%, transparent 100%);
}

.image3 {
    z-index: 2;
    mask-image: linear-gradient(to bottom, transparent 0%, black 30%, black 70%, transparent 100%);
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 30%, black 70%, transparent 100%);
}

.image4 {
    z-index: 1;
    height: 100vh;
    mask-image: linear-gradient(to bottom, transparent 0%, black 30%, black 100%);
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 30%, black 100%);
}
</style>
</head>
<body>
    <img src="../assets/grandpa_background.webp" class="image1">

    <img src="../assets/joja_background.jpg" class="image2">

    <img src="../assets/grandpaletter_background.jpg" class="image3">

    <img src="../assets/stardewvalley_background.jpg" class="image4">

    Gradient + Photo Background Example
</body>
</html>
